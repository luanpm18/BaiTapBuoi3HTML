<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Murach's Java Servlets and JSP</title>
    <link rel="stylesheet" href="styles/style.css"/>
</head>
<body>
<img src="img/murach.png" alt="Ảnh murach">
<h1>Survey</h1>
<p>If you have a moment, we'd appreciate it if you would fill out this survey.</p>

<form action="emailList" method="post">

    <section class="form-group">
        <h2>Your information:</h2>
        <input type="hidden" name="action" value="add">

        <label>First Name:</label>
        <input type="text" name="firstName" required><br>

        <label>Last Name:</label>
        <input type="text" name="lastName" required><br>

        <label>Email:</label>
        <input type="email" name="email" required><br>

        <label>Date of birth:</label>
        <input type="date" name="date" required><br>
    </section>

    <section class="radio-group">
        <h2>How did you hear about us?</h2>
        <input type="radio" name="hearAbout" value="Search engine" checked>
        <label>Search engine</label>

        <input type="radio"  name="hearAbout" value="Word of mouth">
        <label>Word of mouth</label>

        <input type="radio" name="hearAbout" value="Social Media">
        <label>Social Media</label>

        <input type="radio" name="hearAbout" value="Other">
        <label>Other</label>
    </section>

    <section class="checkbox-group">
        <h2>Would you like to receive announcements about new CDs and special offers?</h2>

        <input type="checkbox" id="yesLike" name="announcementLike" value="YES, I'd like that">
        <label>YES, I'd like that.</label>
        <br>

        <input type="checkbox" id="yesSend" name="announcementSend" value="YES, please send me announcements">
        <label>YES, please send me announcements.</label>
    </section>

    <section class="dropdown-group">
        <label for="contactMethod">Please contact me by:</label>
        <select id="contactMethod" name="contactMethod" multiple>
            <option value="Email or postal mail">Email or postal mail</option>
            <option value="Email only">Email only</option>
            <option value="Postal mail only">Postal mail only</option>
        </select>
    </section>

    <input type="submit" value="Submit" id="submit">

</form>
</body>
</html>
